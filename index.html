<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个 CodeM 沙箱实验</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .card {
      background: #ffffff;
      padding: 48px 56px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    h1 {
      font-size: 20px;
      color: #333;
      margin-bottom: 28px;
      font-weight: 600;
    }
    button {
      padding: 14px 40px;
      font-size: 16px;
      color: #fff;
      background: #4f46e5;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #4338ca; }
    button:active { transform: scale(0.97); }
    button.reset {
      margin-left: 12px;
      background: #6b7280;
    }
    button.reset:hover { background: #4b5563; }
    #result {
      margin-top: 24px;
      font-size: 18px;
      font-weight: 600;
      color: #10b981;
      min-height: 24px;
    }
    #count {
      margin-top: 12px;
      font-size: 16px;
      color: #6b7280;
      min-height: 20px;
    }
    .stats {
      margin-top: 20px;
      padding: 16px 20px;
      background: #f9fafb;
      border-radius: 10px;
      text-align: left;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #4b5563;
      padding: 4px 0;
    }
    .stats-row .label { color: #9ca3af; }
    .stats-row .value { font-weight: 600; color: #374151; }
    #resetMsg {
      margin-top: 10px;
      font-size: 14px;
      color: #6b7280;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>我的第一个 CodeM 沙箱实验</h1>
    <button id="btn">点我</button>
    <button id="resetBtn" class="reset">重置</button>
    <div id="result"></div>
    <div id="count">已点击 0 次</div>
    <div class="stats">
      <div class="stats-row">
        <span class="label">总点击次数</span>
        <span class="value" id="totalCount">0</span>
      </div>
      <div class="stats-row">
        <span class="label">最近点击时间</span>
        <span class="value" id="lastClickTime">—</span>
      </div>
      <div class="stats-row">
        <span class="label">最高连续点击</span>
        <span class="value" id="maxStreak">0</span>
      </div>
      <div class="stats-row">
        <span class="label">距上次点击</span>
        <span class="value" id="interval">—</span>
      </div>
    </div>
    <div id="resetMsg"></div>
  </div>
  <script>
    let clickCount = 0;
    let lastClickTs = 0;       // 上一次点击的时间戳（ms）
    let maxStreak = 0;         // 最高连续点击次数
    let currentStreak = 0;     // 当前连续点击次数
    const STREAK_GAP = 2000;   // 2 秒内算连续点击

    function formatTime(ts) {
      if (!ts) return '—';
      var d = new Date(ts);
      return d.toLocaleTimeString('zh-CN', { hour12: false });
    }

    function updateInterval() {
      if (lastClickTs > 0) {
        var gap = Date.now() - lastClickTs;
        document.getElementById('interval').textContent = gap < 1000 ? gap + ' ms' : (gap / 1000).toFixed(1) + ' s';
      } else {
        document.getElementById('interval').textContent = '—';
      }
    }

    function updateCount() {
      document.getElementById('count').textContent = '已点击 ' + clickCount + ' 次';
      document.getElementById('totalCount').textContent = clickCount;
      document.getElementById('lastClickTime').textContent = formatTime(lastClickTs);
      document.getElementById('maxStreak').textContent = maxStreak;
      updateInterval();
    }

    // 实时刷新「距上次点击」间隔
    setInterval(updateInterval, 200);

    function handleClick() {
      clickCount++;
      var now = Date.now();

      // 判断是否为连续点击
      if (lastClickTs > 0 && now - lastClickTs <= STREAK_GAP) {
        currentStreak++;
      } else {
        currentStreak = 1;
      }
      if (currentStreak > maxStreak) {
        maxStreak = currentStreak;
      }
      lastClickTs = now;

      document.getElementById('result').textContent = '🎉 沙箱运行成功';
      document.getElementById('resetMsg').textContent = '';
      updateCount();
    }

    function handleReset() {
      if (clickCount === 0) {
        document.getElementById('resetMsg').textContent = '当前无统计数据可重置';
        return;
      }
      var prev = clickCount;
      clickCount = 0;
      lastClickTs = 0;
      maxStreak = 0;
      currentStreak = 0;
      document.getElementById('result').textContent = '';
      document.getElementById('resetMsg').textContent = '已重置 ' + prev + ' 次点击记录';
      updateCount();
    }

    document.getElementById('btn').addEventListener('click', handleClick);
    document.getElementById('resetBtn').addEventListener('click', handleReset);
    updateCount();
  </script>
</body>
</html>
