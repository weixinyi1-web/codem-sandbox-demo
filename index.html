<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个 CodeM 沙箱实验</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .card {
      background: #ffffff;
      padding: 48px 56px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    h1 {
      font-size: 20px;
      color: #333;
      margin-bottom: 28px;
      font-weight: 600;
    }
    button {
      padding: 14px 40px;
      font-size: 16px;
      color: #fff;
      background: #4f46e5;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #4338ca; }
    button:active { transform: scale(0.97); }
    #result {
      margin-top: 24px;
      font-size: 18px;
      font-weight: 600;
      color: #10b981;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>我的第一个 CodeM 沙箱实验</h1>
    <button id="btn">点我</button>
    <div id="result"></div>
  </div>
  <script>
    document.getElementById('btn').addEventListener('click', function () {
      document.getElementById('result').textContent = '沙箱运行成功';
    });
  </script>
</body>
</html>
